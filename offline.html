<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#1e1b4b;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
.c{max-width:360px}
img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(30,27,75,.25)}
h1{font-size:22px;margin:18px 0 8px}
p{margin:0 0 20px;color:#64748b}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 26px;background:#312e81;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="c">
<img src="icon-192.png" alt="">
<h1>No internet connection</h1>
<p>Turn on internet and try again.</p>
<button type="button" onclick="location.reload()">Retry</button>
</div>
</body>
</html>
