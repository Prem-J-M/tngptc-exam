}
function kbRender(){
 var k=$("kb");k.textContent="";
 KB[kbMode].forEach(function(row){
  var r=el("div",null,"r");
  row.forEach(function(c){
   if(c==="SHIFT"){
    var s=kbKey(kbCaps?"CAPS":"\u21E7","w"+(kbShift||kbCaps?" on":""),function(){
     var n=Date.now();
     if(kbShift&&n-kbLast<400){kbCaps=true;kbShift=false}
     else if(kbCaps){kbCaps=false;kbShift=false}
     else{kbShift=!kbShift}
     kbLast=n;kbRender()});
    r.appendChild(s);
   }else if(c==="BKSP"){r.appendChild(kbKey("\u232B","w",kbBack))}
   else if(c==="SYM"){r.appendChild(kbKey("#+=","w",function(){kbMode="sym";kbRender()}))}
   else if(c==="NUM"){r.appendChild(kbKey("123","w",function(){kbMode="num";kbRender()}))}
   else{
    var up=kbMode==="abc"&&(kbShift||kbCaps);
    var ch=up?c.toUpperCase():c;
    r.appendChild(kbKey(ch,"",function(){kbType(ch);if(kbShift){kbShift=false;kbRender()}}));
   }
  });
  k.appendChild(r);
 });
 var r=el("div",null,"r");
 if(kbMode==="abc")r.appendChild(kbKey("123","w",function(){kbMode="num";kbRender()}));
 else r.appendChild(kbKey("ABC","w",function(){kbMode="abc";kbRender()}));
 r.appendChild(kbKey(",","",function(){kbType(",")}));
 r.appendChild(kbKey("space","sp",function(){kbType(" ")}));
 r.appendChild(kbKey(".","",function(){kbType(".")}));
 r.appendChild(kbKey("\u21B5","w",function(){kbType("\n")}));
 k.appendChild(r);
 document.documentElement.style.setProperty("--kbh",k.hidden?"0px":k.offsetHeight+"px");
}
function kbShow(t){
 kbTa=t;kbMode="abc";kbShift=false;kbCaps=false;
 $("kb").hidden=false;kbRender();
 document.documentElement.style.setProperty("--kbh",$("kb").offsetHeight+"px");
 $("v-exam").style.paddingBottom=$("kb").offsetHeight+"px";
}
function kbHide(){
 kbTa=null;var k=$("kb");if(k)k.hidden=true;
 document.documentElement.style.setProperty("--kbh","0px");
 var v=$("v-exam");if(v)v.style.paddingBottom="";
}
/* ---------- question view ---------- */
function answered(q){var a=cur.ans[q.id]||{};return Number(q.marks)===1?!!a.o:!!(a.t&&a.t.trim())}
function setAns(id,v){
 cur.ans[id]=Object.assign(cur.ans[id]||{},v);cur.dirty[id]=1;
 try{localStorage.setItem("tng_a_"+cur.aid,JSON.stringify(cur.ans))}catch(e){}
}
function renderQ(){
 var q=cur.qs[cur.idx],box=$("qbox");box.textContent="";
 $("qnum").textContent="Question "+(cur.idx+1)+" of "+cur.qs.length+" ("+q.marks+(Number(q.marks)===1?" mark":" marks")+")";
 box.appendChild(el("div",q.text,"qt"));
 var a=cur.ans[q.id]||{};
 if(Number(q.marks)===1){
  kbHide();
  q.opts.forEach(function(L,i){
   var o=el("button",null,"opt"+(a.o===L.toUpperCase()?" sel":""));o.type="button";
   o.appendChild(el("b",String.fromCharCode(65+i)+". "));o.appendChild(document.createTextNode(q[L]||""));
   o.onclick=function(){setAns(q.id,{o:L.toUpperCase()});renderQ()};
   box.appendChild(o);
  });
 }else{
  var t=document.createElement("textarea");t.rows=10;t.value=a.t||"";t.placeholder="Type your answer here";
  t.setAttribute("autocomplete","off");t.setAttribute("spellcheck","false");
  t.oninput=function(){setAns(q.id,{t:t.value});palette()};
  t.setAttribute("inputmode","none");t.setAttribute("autocapitalize","off");t.setAttribute("autocorrect","off");t.setAttribute("enterkeyhint","enter");
  t.addEventListener("beforeinput",function(e){e.preventDefault()});
  t.addEventListener("keydown",function(e){if(e.key==="Backspace"||e.key==="Delete"||e.key.indexOf("Arrow")===0||e.key==="Home"||e.key==="End"||e.key==="Tab")return;e.preventDefault()});
  t.addEventListener("compositionstart",function(e){e.preventDefault()});
  box.appendChild(t);kbShow(t);
 }
 $("prev").disabled=cur.idx===0;$("next").disabled=cur.idx===cur.qs.length-1;
 palette();
}
function palette(){
 var p=$("pal");p.textContent="";
 cur.qs.forEach(function(q,i){
  var b=el("button",String(i+1),(answered(q)?"a ":"")+(i===cur.idx?"c":""));b.type="button";
  b.onclick=function(){cur.idx=i;renderQ()};p.appendChild(b);
 });
}
$("prev").onclick=function(){if(cur.idx>0){cur.idx--;renderQ();window.scrollTo(0,0)}};
$("next").onclick=function(){if(cur.idx<cur.qs.length-1){cur.idx++;renderQ();window.scrollTo(0,0)}};
$("sub").onclick=function(){
 var n=cur.qs.filter(function(q){return!answered(q)}).length;
 modal("Submit exam?",(n?n+" question(s) not answered. ":"All questions answered. ")+"You cannot change answers after submitting.",[["Submit",function(){if(cur.hc)askCode();else submit("submitted")},"btn red"],["Go back",null,"btn alt"]]);
};
var tbT=null;
function banner(t){
 var b=$("tb");b.textContent=t+" min left";b.className=t<=5?"hot":"";b.hidden=false;
 try{if(navigator.vibrate)navigator.vibrate(t<=5?[200,100,200]:200)}catch(e){}
 clearTimeout(tbT);tbT=setTimeout(function(){b.hidden=true},4000);
}
/* ---------- timer, save, submit ---------- */
function onTick(){
 if(!cur||cur.done)return;
 var left=Math.max(0,Math.round((cur.deadline-Date.now())/1000));
 $("x-time").textContent=hms(left);
 if(left>0){
  cur.warned=cur.warned||{};
  [30,25,20,15,10,5,1].forEach(function(t){
   var m=t*60;
   if(left<=m&&!cur.warned[t]){cur.warned[t]=1;if(left>m-8)banner(t)}
  });
 }
 if(left<=0){modal("Time is up","Submitting your exam...",[]);submit("auto_submitted")}
}
function setNet(ok,m){$("x-net").textContent=ok?"":"Not saved to server yet ("+(m||"no internet")+"). Answers are kept on your phone."}
async function autosave(){if(cur&&!cur.done){await flush();await save()}}
async function save(){
 if(!cur||cur.saving)return;
 var ids=Object.keys(cur.dirty);if(!ids.length)return;
 cur.saving=true;var snap={};
 var arr=ids.map(function(id){var a=cur.ans[id]||{};snap[id]=JSON.stringify(a);return{q:id,t:a.t||"",o:a.o||""}});
 var r=await sb.rpc("save_answers",{p_attempt:cur.aid,p_answers:arr});
 if(!cur)return;cur.saving=false;
 if(r.error){setNet(false,r.error.message);return}
 setNet(true);
 if(r.data&&r.data.saved===false&&r.data.status&&r.data.status!=="in_progress"){finish(r.data.status);return}
 ids.forEach(function(id){if(JSON.stringify(cur.ans[id]||{})===snap[id])delete cur.dirty[id]});
}
async function submit(st,code){
 if(!cur||cur.done)return;cur.done=true;
 var arr=Object.keys(cur.ans).map(function(id){var a=cur.ans[id];return{q:id,t:a.t||"",o:a.o||""}});
 var r=await sb.rpc("submit_exam",{p_attempt:cur.aid,p_answers:arr,p_status:st,p_code:code||null,p_device:DEV});
 if(r.error){
  cur.done=false;var em=(r.error.message||r.error.details||r.error.hint||String(r.error));setNet(false,em);
  if(st==="auto_submitted"){modal("Time is up","Submit failed: "+em+" (retrying...)",[]);setTimeout(function(){submit(st)},5000)}
  else msg("Submit failed: "+em);
  return;
 }

 if(r.data&&(r.data.status==="wrong_code"||r.data.status==="code_locked")){
  cur.done=false;
  if(st==="auto_submitted"){setTimeout(function(){submit(st)},3000);return}
  if(r.data.status==="code_locked"){modal("Too many wrong codes","You cannot submit manually now. Your exam will be submitted automatically when the time ends.",[["OK",function(){renderQ()},"btn"]]);return}
  askCode("Wrong secret code. Try again ("+r.data.left+" tries left).");return;
 }
 finish(r.data.status);
}
function finish(status){
 var aid=cur&&cur.aid;
 clearInterval(tick);clearInterval(saver);stopPing();
 try{localStorage.removeItem("tng_active");if(aid)localStorage.removeItem("tng_a_"+aid)}catch(e){}
 cur=null;exitFull();$("ov").hidden=true;
 $("d-t").textContent=status==="auto_submitted"?"Exam auto-submitted":"Exam submitted";
 $("d-p").textContent=status==="auto_submitted"?"Your exam was submitted automatically (time over or warning limit reached). Your answers are saved.":"Your answers are saved. Results will be shown after your teacher completes marking.";
 show("v-done");
}
$("d-back").onclick=function(){show("v-list");loadList()};
/* ---------- anti-cheat ---------- */
async function flush(){
 if(!cur||cur.done||!cur.pend.length)return;
 while(cur&&cur.pend.length){
  var ev=cur.pend[0];
  var r=await sb.rpc("log_event",{p_attempt:cur.aid,p_type:ev.t,p_detail:ev.d||null,p_warn:ev.w});
  if(!cur)return;
  if(r.error)return;
  cur.pend.shift();
  if(r.data){if(r.data.status&&r.data.status!=="in_progress"){finish(r.data.status);return}
   if(r.data.warnings>cur.warn){cur.warn=r.data.warnings;warnLabel()}}
 }
}
async function leave(type){
 if(!cur||cur.done||Date.now()-lastL<2500)return;
 lastL=Date.now();
 cur.warn++;warnLabel();
 cur.pend.push({t:type,d:null,w:true});
 await flush();
 if(cur&&!cur.done&&cur.warn>=cur.mx){submit("auto_submitted");return}
 modal("Warning "+cur.warn+"/"+cur.mx,"You left the exam screen. Your teacher has been notified. Too many warnings will auto-submit your exam.",[["Continue",function(){goFull()},"btn"]]);
}
function logEv(type,detail){
 if(!cur||cur.done)return;
 cur.pend.push({t:type,d:detail||null,w:false});flush();
}
document.addEventListener("visibilitychange",function(){if(document.hidden)leave("left_page")});
window.addEventListener("blur",function(){if(cur&&!cur.done)leave("window_blur")});
document.addEventListener("fullscreenchange",function(){
 if(cur&&!cur.done&&!document.fullscreenElement&&fullOK)leave("exited_fullscreen");
});
["copy","cut","paste","contextmenu","dragstart","selectstart"].forEach(function(ev){
 document.addEventListener(ev,function(e){
  if(!cur||cur.done)return;
  if(ev==="selectstart"&&e.target&&e.target.tagName==="TEXTAREA")return;
  e.preventDefault();
  if(ev==="copy"||ev==="cut"||ev==="paste")logEv("blocked_"+ev);
 });
});
document.addEventListener("keydown",function(e){
 if(!cur||cur.done)return;
 var k=(e.key||"").toLowerCase();
 if((e.ctrlKey||e.metaKey)&&["c","v","x","p","s","u","a"].indexOf(k)>-1){e.preventDefault();logEv("blocked_key",k)}
 if(k==="printscreen"||k==="f12"){e.preventDefault();logEv("blocked_key",k)}
});
window.addEventListener("beforeunload",function(e){if(cur&&!cur.done){e.preventDefault();e.returnValue=""}});
window.addEventListener("online",function(){if(cur&&!cur.done)autosave()});
window.tngNative=function(t){if(cur&&!cur.done)leave(String(t).slice(0,30))};
/* ---------- buttons ---------- */
$("refresh").onclick=function(){loadList();loadResults(true)};
$("out").onclick=async function(){
 if(cur&&!cur.done){msg("Finish or submit your exam first");return}
 try{await sb.auth.signOut()}catch(e){}
 location.href="index.html";
};
/* ---------- boot ---------- */
(async function(){
 try{
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){location.replace("index.html");return}
  var p=await sb.from("profiles").select("role,full_name,roll_no").eq("id",s.data.session.user.id).single();
  if(p.error||!p.data||p.data.role!=="student"){try{await sb.auth.signOut()}catch(e){}location.replace("index.html");return}
  prof=p.data;
  $("who").textContent=prof.full_name||"";
  document.body.hidden=false;
  show("v-list");
  var act=null;try{act=localStorage.getItem("tng_active")}catch(e){}
  if(act){
   try{await enter(act,false)}catch(e){try{localStorage.removeItem("tng_active")}catch(x){}}
   if(cur)return;
  }
  loadList();
 }catch(e){tngShow("Error: "+(e&&e.message||e))}
})();
})();
</script>
</body></html>
