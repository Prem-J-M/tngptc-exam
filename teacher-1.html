<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teacher | TNGPTC Exam Portal</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--text:#14213d;--muted:#5b6578;--line:#d3d9e4;--brand:#12263f;--bt:#fff;--err:#b3261e;--ok:#1b6b3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#16202f;--text:#e8edf5;--muted:#9aa6ba;--line:#2a374b;--brand:#e8edf5;--bt:#12263f;--err:#ff8a80;--ok:#6fd28f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--brand);color:var(--bt)}
header button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.btn{margin-top:12px;margin-right:8px;padding:10px 16px;border:0;border-radius:8px;background:var(--brand);color:var(--bt);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--err);color:#fff}
.btn:disabled{opacity:.5}.sm{margin:0;padding:6px 10px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
small{color:var(--muted);display:block}.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px}
#msg{position:sticky;top:0;z-index:5;margin-bottom:10px;padding:10px 12px;border-radius:8px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.e{color:var(--err)}.o{color:var(--ok)}
</style></head><body hidden>
<header><b>TNGPTC Teacher</b><span id="who"></span><button id="out" type="button">Log out</button></header>
<main><div id="msg" hidden></div>
<section id="v-list">
<form class="card" id="f-exam" novalidate><h2>Create exam</h2>
<label for="e-name">Exam name</label><input id="e-name">
<label for="e-sub">Subject</label><input id="e-sub">
<label for="e-sec">Section</label><select id="e-sec"></select>
<label for="e-start">Date and time</label><input id="e-start" type="datetime-local">
<label for="e-dur">Duration (minutes)</label><input id="e-dur" type="number" inputmode="numeric" value="60">
<label for="e-warn">Warnings before auto-submit</label><input id="e-warn" type="number" inputmode="numeric" value="3">
<button class="btn" type="submit">Create exam</button></form>
<div class="card"><h2>My exams</h2><div id="elist"></div></div></section>
<section id="v-exam" hidden>
<div class="card"><button class="btn alt sm" id="back" type="button">Back to exams</button>
<h2 id="x-title" style="margin-top:12px"></h2><small id="x-info"></small><small id="x-lock"></small>
<button class="btn" id="x-pub" type="button"></button><button class="btn red" id="x-del" type="button">Delete exam</button></div>
<form class="card" id="f-q" novalidate><h2>Add question</h2>
<label for="q-marks">Marks (1 = multiple choice, others = written)</label><input id="q-marks" inputmode="decimal" value="1">
<label for="q-text">Question</label><textarea id="q-text" rows="3"></textarea>
<div id="q-opts"><label for="q-a">Option A</label><input id="q-a"><label for="q-b">Option B</label><input id="q-b">
<label for="q-c">Option C</label><input id="q-c"><label for="q-d">Option D</label><input id="q-d">
<label for="q-key">Correct option</label><select id="q-key"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
<button class="btn" type="submit">Add question</button></form>
<div class="card"><h2 id="q-title">Questions</h2><div id="qlist"></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var sb=window.supabase.createClient("https://trunjmpvfdrxemjrndck.supabase.co","sb_publishable_COevBDyL8fdCHJuIpEHGVA_mwPcIrKv");
var uid,exam=null,qs=[];
function el(t,x,c){var e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function msg(t,ok){var m=$("msg");m.textContent=t;m.className=ok?"o":"e";m.hidden=false;setTimeout(function(){m.hidden=true},6000)}
function clean(e){var m=(e&&e.message)||"Failed";return/row-level|policy/i.test(m)?"Not allowed. The exam may have already started.":m}
function fmt(s){return new Date(s).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})}
["A","B","C","D","E","F","G","A2","B2","C2","D2"].forEach(function(s){var o=el("option",s);o.value=s;$("e-sec").appendChild(o)});
async function loadExams(){
 $("v-list").hidden=false;$("v-exam").hidden=true;exam=null;
 var r=await sb.from("exams").select("*").eq("teacher_id",uid).order("start_time",{ascending:false});
 var b=$("elist");b.textContent="";
 if(r.error){msg(clean(r.error));return}
 if(!r.data.length){b.textContent="No exams yet.";return}
 r.data.forEach(function(x){
  var d=el("div",null,"item"),l=el("div",x.name);
  l.appendChild(el("small",x.subject+" | Section "+x.section+" | "+fmt(x.start_time)+" | "+x.duration_min+" min"));
  l.appendChild(el("span",x.status,"pill"));
  var o=el("button","Open","btn sm");o.type="button";o.onclick=function(){openExam(x)};
  d.appendChild(l);d.appendChild(o);b.appendChild(d)});
}
function started(){return new Date(exam.start_time)<=new Date()}
function openExam(x){exam=x;$("v-list").hidden=true;$("v-exam").hidden=false;draw();loadQs()}
function draw(){
 $("x-title").textContent=exam.name;
 $("x-info").textContent=exam.subject+" | Section "+exam.section+" | "+fmt(exam.start_time)+" | "+exam.duration_min+" min | "+exam.max_warnings+" warnings";
 $("x-lock").textContent=started()?"Exam time has started. Editing is locked.":"";
 $("x-pub").textContent=exam.status==="published"?"Unpublish":"Publish";
 $("f-q").hidden=started();
}
async function loadQs(){
 var r=await sb.from("questions").select("*,question_keys(correct_option)").eq("exam_id",exam.id).order("position");
 var b=$("qlist");b.textContent="";
 if(r.error){msg(clean(r.error));return}
 qs=r.data;$("q-title").textContent="Questions ("+qs.length+")";
 if(!qs.length){b.textContent="No questions yet.";return}
 qs.forEach(function(q,i){
  var d=el("div",null,"item"),l=el("div",(i+1)+". "+q.question_text);
  l.appendChild(el("small","["+q.marks+" mark"+(q.marks==1?"":"s")+"] "+(q.q_type==="mcq"?"Multiple choice":"Written")));
  if(q.q_type==="mcq"){
   ["a","b","c","d"].forEach(function(k){l.appendChild(el("small",k.toUpperCase()+") "+q["option_"+k]))});
   var kk=q.question_keys;kk=Array.isArray(kk)?kk[0]:kk;
   l.appendChild(el("small","Correct: "+(kk?kk.correct_option:"-")))}
  d.appendChild(l);
  if(!started()){var x=el("button","Delete","btn sm red");x.type="button";x.onclick=async function(){
   var e=await sb.from("questions").delete().eq("id",q.id);if(e.error)msg(clean(e.error));else loadQs()};d.appendChild(x)}
  b.appendChild(d)});
}
$("f-exam").onsubmit=async function(e){
 e.preventDefault();
 var n=$("e-name").value.trim(),s=$("e-sub").value.trim(),st=$("e-start").value,du=parseInt($("e-dur").value,10),w=parseInt($("e-warn").value,10);
 if(!n||!s||!st){msg("Fill name, subject and date/time");return}
 if(new Date(st)<=new Date()){msg("Start time must be in the future");return}
 if(!(du>=5&&du<=300)){msg("Duration must be 5 to 300 minutes");return}
 if(!(w>=1&&w<=10)){msg("Warnings must be 1 to 10");return}
 var r=await sb.from("exams").insert({teacher_id:uid,name:n,subject:s,section:$("e-sec").value,start_time:new Date(st).toISOString(),duration_min:du,max_warnings:w});
 if(r.error){msg(clean(r.error));return}
 e.target.reset();$("e-dur").value=60;$("e-warn").value=3;msg("Exam created",true);loadExams();
};
$("back").onclick=loadExams;
$("x-pub").onclick=async function(){
 var ns=exam.status==="published"?"draft":"published";
 if(ns==="published"&&!qs.length){msg("Add at least one question first");return}
 var r=await sb.from("exams").update({status:ns}).eq("id",exam.id);
 if(r.error){msg(clean(r.error));return}
 exam.status=ns;draw();msg(ns==="published"?"Published":"Moved back to draft",true);
};
$("x-del").onclick=async function(){
 if(!confirm("Delete this exam and all its questions?"))return;
 var r=await sb.from("exams").delete().eq("id",exam.id);
 if(r.error)msg(clean(r.error));else{msg("Exam deleted",true);loadExams()}
};
function optsShow(){$("q-opts").hidden=(parseFloat($("q-marks").value)!==1)}
$("q-marks").oninput=optsShow;
$("f-q").onsubmit=async function(e){
 e.preventDefault();
 var m=parseFloat($("q-marks").value),t=$("q-text").value.trim();
 if(!(m>0)||m*2!==Math.round(m*2)){msg("Marks must be a positive number in steps of 0.5",false);return}
 if(!t){msg("Enter the question",false);return}
 var row={exam_id:exam.id,position:qs.length+1,question_text:t,marks:m};
 if(m===1){
  var o=["a","b","c","d"].map(function(k){return $("q-"+k).value.trim()});
  if(o.some(function(v){return!v})){msg("Fill all four options",false);return}
  row.option_a=o[0];row.option_b=o[1];row.option_c=o[2];row.option_d=o[3];
 }
 var r=await sb.from("questions").insert(row).select("id").single();
 if(r.error){msg(clean(r.error));return}
 if(m===1){
  var k=await sb.from("question_keys").insert({question_id:r.data.id,correct_option:$("q-key").value});
  if(k.error){await sb.from("questions").delete().eq("id",r.data.id);msg(clean(k.error));return}
 }
 e.target.reset();$("q-marks").value=1;optsShow();msg("Question added",true);loadQs();
};
$("out").onclick=async function(){await sb.auth.signOut();location.href="index.html"};
(async function(){
 var s=(await sb.auth.getSession()).data.session;
 if(!s){location.href="index.html";return}
 uid=s.user.id;
 var p=(await sb.from("profiles").select("role,full_name").eq("id",uid).single()).data;
 if(!p||p.role!=="teacher"){location.href="index.html";return}
 $("who").textContent=p.full_name||"Teacher";document.body.hidden=false;loadExams();
})();
})();
</script></body></html>
