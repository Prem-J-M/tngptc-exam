<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live monitor | TNGPTC Exam Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1e1b4b;--brand2:#312e81;--bt:#fff;--accent:#d97706;--accent-l:#fef3c7;--err:#dc2626;--errbg:#fef2f2;--ok:#16a34a;--okbg:#f0fdf4;--warn:#b45309;--warnbg:#fff4d6;--info:#3730a3;--infobg:#e0e7ff;--glow:rgba(217,119,6,.35);--shadow:0 12px 30px -10px rgba(30,27,75,.25),0 0 0 1px rgba(30,27,75,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f19;--card:#141c2e;--text:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--brand:#fbbf24;--brand2:#f59e0b;--bt:#0f172a;--accent:#fbbf24;--accent-l:rgba(251,191,36,.15);--err:#f87171;--errbg:#3a1d1d;--ok:#4ade80;--okbg:#14301e;--warn:#fcd34d;--warnbg:#3a3014;--info:#a5b4fc;--infobg:#1e2457;--glow:rgba(251,191,36,.3);--shadow:0 12px 30px -10px rgba(0,0,0,.6),0 0 0 1px rgba(251,191,36,.1);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 92% 4%,rgba(217,119,6,.12),transparent 38%),radial-gradient(circle at 4% 96%,rgba(49,46,129,.14),transparent 40%),var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;border-bottom:3px solid #fbbf24;box-shadow:0 6px 20px -8px rgba(30,27,75,.6)}
header b{font-weight:800}
header a,header button{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(251,191,36,.7);border-radius:10px;padding:7px 14px;text-decoration:none;font:inherit;font-weight:600;cursor:pointer}
header a:hover,header button:hover{background:rgba(251,191,36,.25)}
#who{color:#fde68a;font-weight:600}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:0 0 12px;font-size:19px;font-weight:800;color:var(--brand)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.btn{margin-top:12px;margin-right:8px;padding:11px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:var(--bt);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -6px rgba(30,27,75,.5),0 0 14px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:none;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 8px 18px -6px rgba(185,28,28,.55)}
.btn:disabled{opacity:.5;box-shadow:none}
.sm{margin:0;padding:7px 12px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
small{color:var(--muted);display:block}
.pill{font-size:12px;font-weight:700;border:1px solid var(--accent);color:var(--accent);background:var(--accent-l);border-radius:99px;padding:2px 10px}
#msg{position:sticky;top:0;z-index:5;margin-bottom:10px;padding:11px 14px;border-radius:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:var(--shadow)}
.e{color:var(--err)}.o{color:var(--ok)}
[hidden]{display:none!important}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.cnt div{border-radius:14px;padding:10px 6px;text-align:center;border:1px solid var(--line);box-shadow:0 2px 8px -4px rgba(30,27,75,.3)}
.cnt b{display:block;font-size:24px;font-weight:800}.cnt span{font-size:12px;font-weight:600}
.c-ok{background:var(--okbg);color:var(--ok)}.c-info{background:var(--infobg);color:var(--info)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-err{background:var(--errbg);color:var(--err)}
tr.s-ok td{background:var(--okbg)}tr.s-info td{background:var(--infobg)}tr.s-warn td{background:var(--warnbg);font-weight:700}tr.s-err td{background:var(--errbg);color:var(--err);font-weight:700}tr.s-gray td{color:var(--muted)}
#msg{color:var(--err)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:600}.legend i{font-style:normal;border-radius:99px;padding:2px 10px}
header span{display:flex;gap:8px;flex-wrap:wrap}
</style><script src="theme.js"></script></head><body hidden>
<header><b>Live monitor</b><span><a href="teacher.html">Exams</a><a href="results.html">Results</a></span></header>
<main><div id="msg" hidden></div>
<div class="card"><h2>Select exam</h2>
<label for="m-sub">Subject</label><select id="m-sub"></select>
<label for="m-exam">Exam</label><select id="m-exam"></select>
<label for="m-filter">Show</label><select id="m-filter"><option value="all">All students</option><option value="warn">Only with warnings</option><option value="live">Only writing now</option><option value="no">Only not started / absent</option></select>
<small id="m-info"></small></div>
<div class="card" id="c-mon" hidden>
<div class="cnt" id="m-cnt"></div>
<div class="legend"><i class="c-ok">Writing</i><i class="c-warn">Warning</i><i class="c-info">Submitted</i><i class="c-err">Absent / auto-submitted</i></div>
<small id="m-upd" style="margin-top:8px"></small>
<div class="scroll" style="margin-top:8px"><table><thead><tr><th>No.</th><th>Roll no</th><th>Name</th><th>Status</th><th>Warn</th><th>Answered</th><th>Last save</th><th>Location</th></tr></thead><tbody id="m-body"></tbody></table></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var sb=window.supabase.createClient("https://trunjmpvfdrxemjrndck.supabase.co","sb_publishable_COevBDyL8fdCHJuIpEHGVA_mwPcIrKv");
var exams=[],data=null,off=0,timer=null,busy=false;
function el(t,x,c){var e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function msg(t){var m=$("msg");if(!t){m.hidden=true;return}m.textContent=t;m.hidden=false}
function dt(x){try{return new Date(x).toLocaleString()}catch(e){return ""}}
function nowMs(){return Date.now()+off}
function ago(x){if(!x)return "-";var s=Math.max(0,Math.floor((nowMs()-Date.parse(x))/1000));if(s<60)return s+" sec ago";var m=Math.floor(s/60);return m<60?m+" min ago":Math.floor(m/60)+" hr ago"}
function left(s){s=Math.max(0,s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")}

async function loadExams(){
 var r=await sb.from("exams").select("id,name,subject,section,start_time").order("start_time",{ascending:false});
 if(r.error){msg("Could not load exams");return}
 exams=r.data||[];
 var s=$("m-sub");s.textContent="";opt(s,"","Select subject");
 var seen={};exams.forEach(function(e){var k=e.subject||"";if(!seen[k]){seen[k]=1;opt(s,k,k||"General")}});
 fillExams();
}
function opt(s,v,t){var o=document.createElement("option");o.value=v;o.textContent=t;s.appendChild(o)}
function fillExams(){
 var sub=$("m-sub").value,s=$("m-exam");s.textContent="";opt(s,"","Select exam");
 if(sub!=="")exams.forEach(function(e){if((e.subject||"")===sub)opt(s,e.id,e.name+" ("+e.section+") - "+dt(e.start_time))});
 s.onchange();
}
$("m-sub").onchange=fillExams;
$("m-exam").onchange=function(){
 data=null;clearInterval(timer);$("c-mon").hidden=true;$("m-info").textContent="";
 if(!$("m-exam").value)return;
 refresh();timer=setInterval(function(){if(!document.hidden)refresh()},10000);
};
$("m-filter").onchange=function(){if(data)draw()};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&$("m-exam").value)refresh()});

async function refresh(){
 var id=$("m-exam").value;if(!id||busy)return;busy=true;
 var r=await sb.rpc("monitor_list",{p_exam:id});
 busy=false;
 if(id!==$("m-exam").value)return;
 if(r.error){msg(r.error.message||"Failed to load");return}
 msg("");data=r.data;off=Date.parse(data.now)-Date.now();draw();
}
setInterval(function(){if(data)tickInfo()},1000);

function state(x){
 var ex=data.exam,st=Date.parse(ex.start_time),en=st+ex.duration_min*60000,n=nowMs();
 if(!x.status){
  if(n<st)return{k:"gray",t:"Exam not started",g:"no"};
  if(n<=en)return{k:"gray",t:"Not started yet",g:"no"};
  return{k:"err",t:"Absent",g:"no"}}
 if(x.status==="in_progress"){
  if(x.warnings>0)return{k:"warn",t:"Writing (warning)",g:"live"};
  return{k:"ok",t:"Writing",g:"live"}}
 if(x.status==="auto_submitted")return{k:"err",t:"Auto-submitted",g:"done"};
 return{k:"info",t:"Submitted",g:"done"};
}
function tickInfo(){
 var ex=data.exam,st=Date.parse(ex.start_time),en=st+ex.duration_min*60000,n=nowMs(),t;
 if(n<st)t="Starts in "+left(Math.floor((st-n)/1000));
 else if(n<=en)t="Time left: "+left(Math.floor((en-n)/1000));
 else t="Exam time is over";
 $("m-info").textContent="Section "+ex.section+"  |  "+dt(ex.start_time)+"  |  "+ex.duration_min+" min  |  "+t;
}
function draw(){
 tickInfo();$("c-mon").hidden=false;
 var rows=data.rows||[],c={total:rows.length,live:0,done:0,no:0,warn:0};
 var fl=$("m-filter").value,out=[];
 rows.forEach(function(x,i){
  var s=state(x);
  if(s.g==="live")c.live++;else if(s.g==="done")c.done++;else c.no++;
  if(x.status&&x.warnings>0)c.warn++;
  var show=fl==="all"||(fl==="warn"&&x.warnings>0)||(fl==="live"&&s.g==="live")||(fl==="no"&&s.g==="no");
  if(show)out.push({x:x,s:s,i:i})});
 var cb=$("m-cnt");cb.textContent="";
 [["Total",c.total,""],["Writing",c.live,"c-ok"],["Submitted",c.done,"c-info"],["Not started / absent",c.no,"c-err"],["With warnings",c.warn,"c-warn"]].forEach(function(a){
  var d=el("div",null,a[2]);d.appendChild(el("b",a[1]));d.appendChild(el("span",a[0]));cb.appendChild(d)});
 var b=$("m-body");b.textContent="";
 out.forEach(function(o){
  var x=o.x,tr=document.createElement("tr");tr.className="s-"+o.s.k;
  var wmax=data.exam.max_warnings;
  tr.appendChild(el("td",o.i+1));tr.appendChild(el("td",x.roll_no||""));tr.appendChild(el("td",x.name||""));
  tr.appendChild(el("td",o.s.t));
  tr.appendChild(el("td",x.status?(x.warnings+" / "+wmax):"-"));
  tr.appendChild(el("td",x.status?(x.answered+" / "+data.total_q):"-"));
  tr.appendChild(el("td",x.status==="in_progress"?ago(x.last_save):"-"));
  var lc=el("td");
  if(x.lat!=null&&x.lng!=null){
   var a=el("a","Map");a.href="https://www.google.com/maps?q="+x.lat+","+x.lng;a.target="_blank";a.rel="noopener";
   lc.appendChild(a);lc.appendChild(document.createTextNode(" "+ago(x.loc_at)+(x.acc?" (\u00B1"+Math.round(x.acc)+"m)":"")));
  }else lc.textContent=x.status?"No location":"-";
  if(x.switches>0)lc.appendChild(el("div","Device changed x"+x.switches));
  tr.appendChild(lc);
  b.appendChild(tr)});
 $("m-upd").textContent="Updated "+new Date().toLocaleTimeString()+" (auto-refresh every 10 sec)";
}

(async function(){
 var s=(await sb.auth.getSession()).data.session;
 if(!s){location.href="index.html";return}
 var p=(await sb.from("profiles").select("role").eq("id",s.user.id).single()).data;
 if(!p||(p.role!=="teacher"&&p.role!=="admin")){location.href="index.html";return}
 document.body.hidden=false;loadExams();
})();
})();
</script></body></html>
